name: Test
on: [ push, pull_request ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # 渲染测试使用真实中文字体，不依赖 Windows 字体安装。
      AMAIDESU_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb fonts-noto-cjk

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check test font
        run: test -r "$AMAIDESU_TEST_FONT"

      - name: Lint regression tests
        run: >-
          uv run ruff check
          tests/agents/streamer/test_planner_context.py
          tests/modules/audio/test_audio_sink_tap.py
          tests/modules/subtitle/test_outline_label_render.py
          tests/modules/vision/test_mss_capture.py
          tests/modules/vision/test_mss_capture_windows.py

      # 模拟 DPI 测试在全部平台执行；真实 Win32 集成测试另由 Windows 执行。
      # pipefail 保留失败状态，faulthandler 和完整日志用于追踪原生崩溃。
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          xvfb-run -a uv run python -X faulthandler -u -m pytest tests/ --collect-only -q 2>&1 | tee test-results/collect.log
          xvfb-run -a uv run python -X faulthandler -u -m pytest tests/ -v --tb=short \
            --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-dpi-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Windows DPI and font tests
        run: >-
          uv run python -X faulthandler -m pytest
          tests/modules/vision/test_mss_capture.py
          tests/modules/vision/test_mss_capture_windows.py
          tests/modules/subtitle/test_outline_label_render.py
          -q --tb=short --junitxml=test-results/windows.xml

      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
