name: Test
on: [ push, pull_request ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # sounddevice 的 Windows wheel 自带 PortAudio，Linux 需系统库
      # （tests/agents 收集链 import 音频模块时触发）
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # 依赖版本以 uv.lock 为准，锁定安装保证 CI 与本地一致
      - name: Install dependencies
        run: uv sync --frozen

      # 错误输出转 ::error:: 注解：协作者之外无法拉取 job 日志。注意 Actions
      # 默认 shell 是 bash -e，pytest 非零退出会当场终止脚本——必须先 set +e
      # 才能执行到转储逻辑；CI 输出含控制字符需剥除、:: 需转义，否则注解被静默丢弃
      - name: Run pytest
        run: |
          set +e
          uv run python -V
          uv run pytest tests/ -q --tb=short > /tmp/pytest-out.txt 2>&1
          status=$?
          size=$(wc -c < /tmp/pytest-out.txt)
          echo "::notice::pytest exit=$status size=$size bytes"
          if [ $status -ne 0 ]; then
            (head -8 /tmp/pytest-out.txt; echo "...[tail]..."; tail -14 /tmp/pytest-out.txt) |
              tr -d '\000-\010\013\014\016-\037\177' |
              sed 's/::/%3A%3A/g' |
              while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::${line:0:250}"
              done
          fi
          exit $status

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uses 步骤不吃 defaults.run.working-directory，packageManager 声明在
      # dashboard/package.json，action 找不到 → 显式钉版本
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test
