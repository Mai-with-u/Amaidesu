name: Test
on: [ push, pull_request ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # 渲染测试使用有中文字形的真实字体，不依赖 Windows 字体安装。
      AMAIDESU_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # 音频库、虚拟显示和中文字体分别满足导入与渲染需求；声卡由测试隔离。
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb fonts-noto-cjk

      # 依赖版本以 uv.lock 为准，锁定安装保证 CI 与本地一致。
      - name: Install dependencies
        run: uv sync --frozen

      - name: Check test font
        run: test -r "$AMAIDESU_TEST_FONT"

      # tee 保留完整输出；pipefail 让 pytest 失败不会被 tee 的成功退出掩盖。
      # 单独收集便于区分导入阶段的原生崩溃与实际测试失败。
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          xvfb-run -a uv run python -u -m pytest tests/ --collect-only -q 2>&1 | tee test-results/collect.log
          xvfb-run -a uv run python -u -m pytest tests/ -q --tb=short \
            -k "not test_context_restored_after_exit and not test_nested_context_restore" \
            --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-dpi-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Windows DPI tests
        run: >-
          uv run python -m pytest
          tests/modules/vision/test_mss_capture.py::TestPerMonitorDpiThread::test_context_restored_after_exit
          tests/modules/vision/test_mss_capture.py::TestPerMonitorDpiThread::test_nested_context_restore
          -q --tb=short

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test
