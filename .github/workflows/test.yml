name: Test
on: [ push, pull_request ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Windows wheel 自带的系统库 Linux 需要安装：libportaudio2（sounddevice
      # 的 tests/agents 收集链触发）；xvfb 提供虚拟显示（pyautogui 等 GUI 库
      # 在无显示环境无法 import/实例化）
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb

      # 依赖版本以 uv.lock 为准，锁定安装保证 CI 与本地一致
      - name: Install dependencies
        run: uv sync --frozen

      # 错误输出转 ::error:: 注解：协作者之外无法拉取 job 日志。注意 Actions
      # 默认 shell 是 bash -e，非零退出会当场终止脚本——必须先 set +e；CI 输出
      # 含控制字符需剥除、:: 需转义。先跑无缓冲纯收集定位硬崩（SIGILL 类）的
      # 崩点文件，再跑正式测试
      - name: Run pytest
        run: |
          set +e
          xvfb-run -a uv run python -u -m pytest tests/ --collect-only -q > /tmp/collect.txt 2>&1
          cstatus=$?
          if [ $cstatus -ne 0 ]; then
            tail -20 /tmp/collect.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::[collect]${line:0:250}"
            done
            exit $cstatus
          fi
          xvfb-run -a uv run python -X faulthandler -u -m pytest tests/ -vv --tb=short > /tmp/pytest-out.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            sed -n '/= ERRORS =/,/short test summary info/p' /tmp/pytest-out.txt |
              tr -d '\000-\010\013\014\016-\037\177' |
              sed 's/::/%3A%3A/g' |
              grep -v '^\s*$' |
              head -30 |
              while IFS= read -r line; do
                echo "::error::${line:0:250}"
              done
            sed -n '/= FAILURES =/,/short test summary info/p' /tmp/pytest-out.txt |
              tr -d '\000-\010\013\014\016-\037\177' |
              sed 's/::/%3A%3A/g' |
              grep -vE '^\s*$|^_{10,}|^={10,}' |
              head -40 |
              while IFS= read -r line; do
                echo "::error::${line:0:250}"
              done
            grep -E "^(FAILED|ERROR) " /tmp/pytest-out.txt | head -25 |
              while IFS= read -r line; do
                echo "::error::${line:0:250}"
              done
            echo "::group::pytest failure diagnostics"
            tail -200 /tmp/pytest-out.txt | sed 's/::/%3A%3A/g'
            echo "::endgroup::"
          fi
          tail -1 /tmp/pytest-out.txt
          exit $status

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uses 步骤不吃 defaults.run.working-directory，packageManager 声明在
      # dashboard/package.json，action 找不到 → 显式钉版本
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test
