name: Test
on: [ push, pull_request ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # 依赖版本以 uv.lock 为准，锁定安装保证 CI 与本地一致
      - name: Install dependencies
        run: uv sync --frozen

      # 错误行转 ::error:: 注解：仓库协作者之外无法拉取 job 日志，注解可匿名读
      - name: Run pytest
        run: |
          set -o pipefail
          uv run pytest tests/ -q --tb=line 2>&1 | tee /tmp/pytest-out.txt
          status=${PIPESTATUS[0]}
          grep -E "^(ERROR|E   |FAILED|Interrupted)" /tmp/pytest-out.txt | head -10 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done
          exit $status

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uses 步骤不吃 defaults.run.working-directory，packageManager 声明在
      # dashboard/package.json，action 找不到 → 显式钉版本
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test
