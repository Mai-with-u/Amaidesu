# 麦麦模型的 Warudo 表情档案
#
# 麦麦的表情做在模型自带的自定义形状上（眉、眼、嘴分开），VRM 标准表情槽是空的，
# 所以不能用默认的 VRM 标准档案。使用方法：把下面整段粘贴进 config/avatar.toml，
# 替换原有的 [platform.warudo.expression] 段，再用蓝图生成脚本按"直接写形状名"
# 方式生成蓝图导入 Warudo。
#
# 本文件只含形状名映射，不含模型文件；模型的授权与分发以模型作者为准。

[platform.warudo.expression]
# 笑眼生效时不眨眼（闭眼键 eye_close 被情绪写入时也会自动暂停眨眼）
blink_blocking_keys = ["eye_happy_strong"]
# 说话时这些嘴形先让位给口型，停嘴后恢复
mouth_keys = [
    "mouth_happy_strong",
    "mouth_angry_weak",
    "mouth_sad_weak",
    "mouth_smlie_2",
    "mouth_smlie_3",
    "mouth_simle_teeth",
]

[platform.warudo.expression.emotions]
neutral = {}
happy = { mouth_happy_strong = 1.0, eyebrow_happy_weak = 0.8 }
sad = { mouth_sad_weak = 1.0, eyebrow_sad_weak = 0.9 }
angry = { mouth_angry_weak = 1.0, eyebrow_angry_strong = 0.9 }
surprised = { mouth_simle_teeth = 0.6, eyebrow_happy_strong = 1.0 }
scared = { eyebrow_sad_strong = 1.0, eye_happy_strong = 0.5 }
disgusted = { mouth_angry_weak = 0.6, eyebrow_angry_weak = 0.7 }
shy = { mouth_smlie_2 = 0.8, eyebrow_happy_weak = 0.4 }
embarrassed = { mouth_smlie_3 = 0.7, eyebrow_sad_weak = 0.3 }
confused = { eyebrow_sad_weak = 0.6, mouth_smlie_2 = 0.2 }
love = { mouth_happy_strong = 0.9, eye_happy_strong = 1.0 }
excited = { mouth_simle_teeth = 1.0, eyebrow_happy_strong = 0.9 }
smug = { mouth_smlie_3 = 0.9, eyebrow_happy_weak = 0.5 }
serious = { eyebrow_angry_weak = 0.5, mouth_angry_weak = 0.3 }
tired = { eye_close = 0.6, mouth_smlie_2 = 0.1 }
crying = { eye_close = 0.8, mouth_sad_weak = 1.0, eyebrow_sad_strong = 0.8 }
speechless = { eyebrow_angry_weak = 0.2 }
