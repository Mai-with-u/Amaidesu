[project]
name = "amaidesu"
version = "2.1.1"
description = "MaiBot VTuber - AI VTuber Assistant with MaiBot Integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

# 核心依赖
dependencies = [
    # Web 框架和网络
    "aiohttp>=3.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.31.0",
    "packaging>=24.0",
    "urllib3>=2.0.0",
    "websockets>=15.0",
    # 日志和配置
    "loguru>=0.7.0",
    # 数据验证
    "pydantic>=2.0",
    "jsonschema>=4.23.0",
    # VTube Studio 控制
    "pyvts>=0.3.0",
    # TTS 相关
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
    # 图像和屏幕捕获
    "mss>=9.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    # LLM API
    "openai>=1.0.0",
    "json_repair>=0.15.0",
    # OBS 控制
    "obs-websocket-py>=1.0",
    # GUI
    "customtkinter>=5.2.0",
    # 自动化和 OSC
    "python-osc>=1.8.0",
    "tomlkit>=0.14.0",
    "python-frontmatter>=1.1.0",
    "watchfiles>=1.1.1",
    "fastmcp>=3.0.0",
    "pygetwindow>=0.0.9",
    "beautifulsoup4>=4.15.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
# 语音识别（需要 PyTorch）
stt = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[project.scripts]
amaidesu = "main:main"

[tool.ruff]
include = ["*.py"]

# 行长度设置
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

# 如果一个变量的名称以下划线开头，即使它未被使用，也不应该被视为错误或警告。
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# 启用的规则
select = [
    "E", # pycodestyle 错误
    "F", # pyflakes
    "B", # flake8-bugbear
    "ASYNC", # async 函数内的阻塞调用（time.sleep / httpx 同步客户端等）
]

# E501 由 line-length 兜底判定差异，暂关；ASYNC109（async 函数带 timeout 参数）是
# 主流写法（httpx/asyncio 官方 API 同形），按噪声处理不启用
ignore = ["E711", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# scripts/ 下的独立脚本需先注入 sys.path 再 import src 包，import 前有语句属预期
"scripts/*" = ["E402"]

# ---- 以下为 tests/ 首次纳入 lint 的存量承接，均待第三批清理 ----
# async 轮询循环里 await asyncio.sleep 属真实问题（项目纪律要求用事件等待），待改为 asyncio.Event
"tests/agents/streamer/test_decision_loop.py" = ["ASYNC110"]
"tests/agents/streamer/test_speech_dispatcher.py" = ["ASYNC110"]
"tests/config/test_file_watcher.py" = ["ASYNC110"]
"tests/modules/simulator/test_integration.py" = ["ASYNC110"]
# 未使用的 import，待第三批清理
"tests/agents/streamer/test_game_decision_trigger.py" = ["F401"]
"tests/agents/streamer/test_reminder_queue.py" = ["F401"]
# async 函数内用阻塞方式创建子进程 / 打开文件，待改异步 API 或移出事件循环
"src/modules/dashboard/server.py" = ["ASYNC220"]
"src/modules/dashboard/vite_dev.py" = ["ASYNC230"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"

# 使用双引号表示字符串
quote-style = "double"

# 尊重魔法尾随逗号
# 例如：
# items = [
#     "apple",
#     "banana",
#     "cherry",
# ]
skip-magic-trailing-comma = false

# 自动检测合适的换行符
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "characterization: tests that pin current behavior before refactoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# 开发依赖唯一声明处（uv 标准；工具链版本下限以实际解析为准）
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "setuptools>=68.0.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# 包索引显式固化：uv 重新解析锁文件时会按当时生效的索引固化下载源，不在
# 此声明的话，开发者本机的 pip 镜像配置（如清华源）会渗入 uv.lock，产生
# 千行 URL 噪音且各机器不一致。取官方源的理由：CI 在海外走官方快且稳；
# uv 全局缓存让每个包只在首次联网下载一次，日常安装零下载，国内开发者仅
# 冷缓存或新增依赖时慢一次，需要加速用 HTTPS 代理（网络层方案，不动锁文
# 件）。uv 没有镜像重写机制，把此处改成镜像源会将镜像固化进锁文件并拖
# 慢 CI，切换前先权衡这两头。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
